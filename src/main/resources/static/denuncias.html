<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LegalTech - Gestión de Denuncias</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--primary:#1e3a5f;
--primary-dark:#13263f;
--secondary:#2e8b57;
--background:#f4f7fb;
--white:#ffffff;
--border:#dce3ea;
--shadow:0 10px 25px rgba(0,0,0,.08);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#eef4fb,#f8fbff);

}

header{

height:75px;

background:linear-gradient(to right,var(--primary-dark),var(--primary));

display:flex;

align-items:center;

justify-content:space-between;

padding:0 40px;

color:white;

box-shadow:var(--shadow);

}

header h1{

font-size:24px;

}

.container{

padding:35px;

}

.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

margin-bottom:30px;

}

.card{

background:white;

padding:25px;

border-radius:18px;

box-shadow:var(--shadow);

}

.stat{

text-align:center;

}

.stat h2{

font-size:38px;

color:var(--primary);

}

.stat p{

margin-top:10px;

color:#666;

font-weight:600;

}

.toolbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

input{

padding:12px;

width:350px;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;

}

button{

background:var(--secondary);

color:white;

border:none;

padding:12px 18px;

border-radius:10px;

cursor:pointer;

font-weight:600;

}

button:hover{

background:#246d44;

}

table{

width:100%;

border-collapse:collapse;

background:white;

box-shadow:var(--shadow);

border-radius:15px;

overflow:hidden;

}

thead{

background:var(--primary);

color:white;

}

th{

padding:15px;

text-align:left;

}

td{

padding:15px;

border-bottom:1px solid #eee;

}

tbody tr:hover{

background:#f5f9ff;

}

.estadoActivo{

background:#dff6e8;

color:#2e8b57;

padding:6px 12px;

border-radius:20px;

font-weight:bold;

}

.estadoInactivo{

background:#ffeaea;

color:#c62828;

padding:6px 12px;

border-radius:20px;

font-weight:bold;

}

.acciones button{

padding:8px 12px;

margin-right:5px;

}

.ver{

background:#1976d2;

}

.editar{

background:#ff9800;

}

.eliminar{

background:#d32f2f;

}

.footer{

margin-top:20px;

text-align:center;

color:#777;

font-size:14px;

}

</style>

</head>

<body>

<header>

<h1>⚖ LEGALTECH</h1>

<div>Sistema de Gestión de Denuncias</div>

</header>

<div class="container">

<div class="stats">

<div class="card stat">

<h2 id="total">0</h2>

<p>Total Denuncias</p>

</div>

<div class="card stat">

<h2 id="activas">0</h2>

<p>Activas</p>

</div>

<div class="card stat">

<h2 id="inactivas">0</h2>

<p>Inactivas</p>

</div>

</div>

<div class="toolbar">

<input type="text" id="buscar" placeholder="🔍 Buscar por código o título">

<button onclick="location.href='index.html'">

➕ Nueva denuncia

</button>

</div>

<table>

<thead>

<tr>

<th>ID</th>

<th>Código</th>

<th>Título</th>

<th>Lugar</th>

<th>Estado</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="tabla">

</tbody>

</table>

<div class="footer">

LegalTech © 2026

</div>

</div>

<script>

let denuncias=[];

let denunciaEditando=null;

fetch("/denuncias")

.then(r=>r.json())

.then(data=>{

denuncias=data;

mostrar(data);

});

function mostrar(lista){

let html="";

let activas=0;

let inactivas=0;

lista.forEach(d=>{

if(d.estado){

activas++;

}else{

inactivas++;

}

html+=`

<tr>

<td>${d.id}</td>

<td>${d.codigo}</td>

<td>${d.titulo}</td>

<td>${d.lugarHechos}</td>

<td>

<span class="${d.estado?'estadoActivo':'estadoInactivo'}">

${d.estado?'Activo':'Inactivo'}

</span>

</td>

<td class="acciones">

<button class="ver" onclick="verDenuncia(${d.id})">👁</button>

<button class="editar" onclick="editarDenuncia(${d.id})">✏</button>

<button class="eliminar" onclick="eliminarDenuncia(${d.id})">🗑</button>

</td>

</tr>

`;

});

document.getElementById("tabla").innerHTML=html;

document.getElementById("total").innerHTML=lista.length;

document.getElementById("activas").innerHTML=activas;

document.getElementById("inactivas").innerHTML=inactivas;

}

buscar.onkeyup=function(){

const texto=this.value.toLowerCase();

const lista=denuncias.filter(x=>

(x.codigo||"").toLowerCase().includes(texto) ||

(x.titulo||"").toLowerCase().includes(texto)

);

mostrar(lista);

}

function verDenuncia(id){

fetch("/denuncias/"+id)

.then(r=>r.json())

.then(d=>{

document.getElementById("detalleDenuncia").innerHTML=`

<p><b>ID:</b> ${d.id}</p>
<p><b>Código:</b> ${d.codigo}</p>
<p><b>Título:</b> ${d.titulo}</p>
<p><b>Descripción:</b> ${d.descripcion}</p>
<p><b>Lugar:</b> ${d.lugarHechos}</p>
<p><b>Referencia:</b> ${d.referencia}</p>
<p><b>Estado:</b> ${d.estado ? "Activo" : "Inactivo"}</p>

`;

document.getElementById("modal").style.display="block";

});

}

function cerrarModal(){

document.getElementById("modal").style.display="none";

}

function editarDenuncia(id){

    fetch("/denuncias/" + id)
    .then(r => r.json())
    .then(d => {

        denunciaEditando = d.id;

        document.getElementById("editCodigo").value = d.codigo || "";
        document.getElementById("editTitulo").value = d.titulo || "";
        document.getElementById("editDescripcion").value = d.descripcion || "";
        document.getElementById("editLugar").value = d.lugarHechos || "";
        document.getElementById("editEstado").checked = d.estado;

        document.getElementById("modalEditar").style.display = "block";

    });

}

async function eliminarDenuncia(id){

    if(!confirm("¿Está seguro de eliminar esta denuncia?")){
        return;
    }

    const respuesta = await fetch("/denuncias/" + id, {
        method: "DELETE"
    });

    if(respuesta.ok){
        alert("Denuncia eliminada correctamente");
        location.reload();
    }else{
        alert("No se pudo eliminar la denuncia");
    }

}

function cerrarEditar(){

    document.getElementById("modalEditar").style.display = "none";

}

function guardarCambios(){

    const denuncia = {

        id: denunciaEditando,

        codigo: document.getElementById("editCodigo").value,

        titulo: document.getElementById("editTitulo").value,

        descripcion: document.getElementById("editDescripcion").value,

        lugarHechos: document.getElementById("editLugar").value,

        estado: document.getElementById("editEstado").checked

    };

    fetch("/denuncias/" + denunciaEditando, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(denuncia)

    })
    .then(r => r.json())
    .then(() => {

        alert("✅ Denuncia actualizada");

        cerrarEditar();

        location.reload();

    })
    .catch(error => {

        console.error(error);

        alert("Error al actualizar.");

    });

}

</script>

<div id="modal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
">

<div
style="
background:white;
width:700px;
margin:50px auto;
padding:25px;
border-radius:15px;
">

<h2>Detalle de la denuncia</h2>

<hr><br>

<div id="detalleDenuncia"></div>

<br>

<button onclick="cerrarModal()">

Cerrar

</button>

</div>

</div>

<div id="modalEditar"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
">

<div
style="
background:white;
width:700px;
margin:50px auto;
padding:25px;
border-radius:15px;
">

<h2>Editar denuncia</h2>

<hr><br>

<label>Código</label><br>
<input type="text" id="editCodigo" style="width:100%;padding:10px;"><br><br>

<label>Título</label><br>
<input type="text" id="editTitulo" style="width:100%;padding:10px;"><br><br>

<label>Descripción</label><br>
<textarea id="editDescripcion" style="width:100%;height:120px;padding:10px;"></textarea><br><br>

<label>Lugar</label><br>
<input type="text" id="editLugar" style="width:100%;padding:10px;"><br><br>

<label>
<input type="checkbox" id="editEstado">
 Activo
</label>

<br><br>

<button onclick="guardarCambios()">💾 Guardar</button>

<button onclick="cerrarEditar()">Cancelar</button>

</div>

</div>

</body>

</html>
